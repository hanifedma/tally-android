# ------------------------------------------------------------
#  Where Tally's cloud lives.
#
#  All three values are public by design and safe to commit:
#    • the project URL is in every request the app makes;
#    • the anon key can only ever act as the signed-in user, because every
#      table is behind row level security;
#    • an OAuth client id is meant to be read out of an app — its security
#      is the certificate fingerprint Google checks it against.
#
#  Fill these in and rebuild. Step by step: SETUP.md.
# ------------------------------------------------------------

# Supabase → Project Settings → Data API → Project URL
supabase.url=PASTE_YOUR_SUPABASE_URL

# Supabase → Project Settings → API Keys → anon / public
supabase.anonKey=PASTE_YOUR_SUPABASE_ANON_KEY

# Google Cloud → APIs & Services → Credentials → the *Web application*
# client id. Not the Android one: Credential Manager asks for a web client
# id, and Supabase verifies the token against that same id.
google.webClientId=PASTE_YOUR_GOOGLE_WEB_CLIENT_ID
